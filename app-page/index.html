<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index.css">
    <title>Demo CE</title>
</head>
<body>
    <h1 id="text1">对Demo CE进行一些设置</h1>
    <p id="text2">请选择您的主题</p>
    <p id="text3">您擅长什么开发?</p>
    <div id="div1">
        <div id="dark-default">
            <div id="line1"></div>
            <div id="line2"></div>
            <div id="line3"></div>
            <div id="preview-leftbar"></div>
            <div id="preview-linesnumbers"></div>
            <div id="preview-leftbar-tools"></div>
        </div>
        <p id="text-dark-default">深色主题(默认)</p>
        <div id="light">
            <div id="line4"></div>
            <div id="line5"></div>
            <div id="line6"></div>
            <div id="preview-light-leftbar"></div>
            <div id="preview-light-linesnumbers"></div>
            <div id="preview-light-leftbar-tools"></div>
        </div>
        <p id="text-light">浅色主题</p>
        <div id="code-language-select-c-cpp" class="code-language-select-top">
            <h1 class="code-language-title">C/C++开发</h1>
            <p class="code-language-intro">深入底层逻辑,难度较高的语言</p>
        </div>
        <div id="code-language-select-web" class="code-language-select-top">
            <h1 class="code-language-title">Web开发</h1>
            <p class="code-language-intro">一般指前端(HTML CSS JS),是网页使用最广泛的技术<span style="font-size: 15px;opacity: 0.7;">(可能也是后端,全栈等)</span></p>
        </div>
        <div id="code-language-select-electron" class="code-language-select-down">
            <h1 class="code-language-title">Electron开发</h1>
            <p class="code-language-intro">可把前端代码打包成桌面程序</p>
        </div>
        <div id="code-language-select-others" class="code-language-select-down">
            <h1 class="code-language-title">其他</h1>
            <p class="code-language-intro">其他,都不是这3项</p>
        </div>
    </div>
    <button id="btn1" onclick="btn1jx();btn1hidden()">继续</button>
    <button id="backbtn1" onclick="backbtn1back()">返回</button>
    <button id="btn2" onclick="btn2jx();">继续</button>
    <button id="tgbtn1">跳过</button>
    <div id="unknown-theme">
        <div class="popup-error-div">
            <img id="error-icon" src="../content/image/ErrorIcon.png">
        </div>
        <h1 id="unknown-theme-text">未知主题,请检查后再试</h1>
        <button class="popup-ok-btn" onclick="hiddenUnknownThemeBtn();">确定</button>
    </div>
    <script src="./js-show1.js"></script>
    <script src="./index.js"></script>
</body>
</html>
